name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Change to master if your default branch is master
  workflow_dispatch: # This keeps your manual trigger button active!

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. This installs Flutter on the virtual machine
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # 2. This builds your Flutter web app into static files
            # Find this step in your deploy.yml and change the 'run:' line:
      - name: Build Web Application
        run: flutter build web --release --base-href "/ilevit/" --web-renderer html



      # 3. This uploads the Flutter build output folder (build/web/)
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
