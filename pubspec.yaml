name: obsidian_note_app
description: "A high-performance visual canvas note-taking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.5.1
  google_fonts: ^6.2.1
  path: ^1.9.0
  shared_preferences: ^2.5.6
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  flutter_launcher_icons: ^0.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  windows: 
    generate: true
    image_path: "assets/logo.png"
  image_path: "assets/logo.png"